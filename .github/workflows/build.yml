name: Compilar Almpes (Windows)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: 1. Descargar codigo base
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Preparar Entorno Windows (LLVM)
        shell: pwsh
        run: |
          choco install llvm -y
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 3. Inyectar Identidad Almpes (Logo, Color, Servidor y Clave)
        shell: pwsh
        run: |
          # 1. Logos (Asegurate de subirlos a tu GitHub primero)
          if (Test-Path "mi_icono.ico") {
              Copy-Item -Path "mi_icono.ico" -Destination "res/icon.ico" -Force
              Copy-Item -Path "mi_icono.ico" -Destination "flutter/windows/runner/resources/app_icon.ico" -Force
          }
          if (Test-Path "mi_logo.png") {
              Copy-Item -Path "mi_logo.png" -Destination "res/logo.png" -Force
              Copy-Item -Path "mi_logo.png" -Destination "res/128x128.png" -Force
              Copy-Item -Path "mi_logo.png" -Destination "res/32x32.png" -Force
          }
          
          # 2. Colores a Rojo
          Get-ChildItem -Path flutter/lib -Recurse -Filter *.dart | ForEach-Object {
              $c = Get-Content $_.FullName -Raw
              if ($c -match 'Colors\.blue') {
                  $c = $c -replace 'Colors\.blue', 'Colors.red'
                  $c = $c -replace 'blueAccent', 'redAccent'
                  Set-Content -Path $_.FullName -Value $c -Encoding UTF8
              }
          }
          
          # 3. Nombre de la Ventana
          $winRunner = "flutter/windows/runner/main.cpp"
          if (Test-Path $winRunner) {
              $c = Get-Content $winRunner -Raw
              $c = $c -replace 'window\.Create\(L"RustDesk",', 'window.Create(L"Almpes",'
              Set-Content -Path $winRunner -Value $c -Encoding UTF8
          }
          
          # 4. Servidor y Clave COMPLETA
          $serverConfig = "flutter/lib/models/server_config.dart"
          if (Test-Path $serverConfig) {
              $c = Get-Content $serverConfig -Raw
              $c = $c -replace "custom-rendezvous-server', ''", "custom-rendezvous-server', '103.195.100.225'"
              $c = $c -replace "key', ''", "key', 'pLGeVp6JeORPB9KTHogPGnMYAH6Qs6blBRA+QSgV3mA='"
              Set-Content -Path $serverConfig -Value $c -Encoding UTF8
          }

      - name: 4. Restaurar Caché de C++ (VCPKG)
        id: cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: vcpkg
          key: vcpkg-windows-almpes-definitivo

      - name: 5. Instalar Motor VCPKG (Se salta porque ya hay cache)
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          git checkout 9e593bb18ea69cc5095e012465dcd675a822ed0d
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install --triplet x64-windows-static --x-install-root="$env:GITHUB_WORKSPACE\vcpkg\installed"

      - name: 6. FORZAR Guardado de Caché
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vcpkg
          key: vcpkg-windows-almpes-definitivo

      - name: 7. Configurar Rust y Flutter
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0
          components: rustfmt
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          architecture: x64

      - name: 8. Ensamblar Almpes
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        shell: pwsh
        run: |
          # Usamos la version exacta 1.82.6
          cargo install flutter_rust_bridge_codegen --version 1.82.6 --features "uuid" --locked
          
          Write-Host "-> Generando Puente..."
          $env:PATH += ";$HOME\.cargo\bin"
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          
          Write-Host "-> Purgando las 5 funciones falsas (dummy code) de la herramienta..."
          $bridgeFile = "src/bridge_generated.rs"
          $lines = Get-Content $bridgeFile
          $cleanLines = $lines | Where-Object { $_ -notmatch 'panic!\("dummy code"\)' }
          Set-Content -Path $bridgeFile -Value $cleanLines -Encoding UTF8
          
          Write-Host "-> Ensamblando Programa Completo..."
          cd flutter
          flutter pub get
          cd ..
          python ./build.py --flutter
          
          $exePath = "flutter/build/windows/x64/runner/Release/rustdesk.exe"
          if (Test-Path $exePath) {
              Rename-Item $exePath "Almpes.exe"
          }

      - name: 9. Entregar Ejecutable Final (Carpeta Completa)
        uses: actions/upload-artifact@v4
        with:
          name: Almpes-Windows-Release
          path: flutter/build/windows/x64/runner/Release/

name: Compilar Almpes (Definitivo)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: 1. Descargar codigo base
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Instalar LLVM (Requisito vital para el puente Rust-Flutter)
        shell: pwsh
        run: |
          Write-Host "-> Instalando LLVM..."
          choco install llvm -y
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 3. Reemplazar Icono y Logo Oficiales
        shell: pwsh
        run: |
          Write-Host "-> Reemplazando iconos oficiales por los de Almpes..."
          if (Test-Path "mi_icono.ico") {
              Copy-Item -Path "mi_icono.ico" -Destination "res/icon.ico" -Force
              Copy-Item -Path "mi_icono.ico" -Destination "flutter/windows/runner/resources/app_icon.ico" -Force
          }
          if (Test-Path "mi_logo.png") {
              Copy-Item -Path "mi_logo.png" -Destination "res/logo.png" -Force
              Copy-Item -Path "mi_logo.png" -Destination "res/128x128.png" -Force
              Copy-Item -Path "mi_logo.png" -Destination "res/32x32.png" -Force
          }

      - name: 4. Magia Automatica (Colores, Titulo e IPs)
        shell: pwsh
        run: |
          Write-Host "-> Cambiando colores a Rojo..."
          Get-ChildItem -Path flutter/lib -Recurse -Filter *.dart | ForEach-Object {
              $c = Get-Content $_.FullName -Raw
              if ($c -match 'Colors\.blue') {
                  $c = $c -replace 'Colors\.blue', 'Colors.red'
                  $c = $c -replace 'blueAccent', 'redAccent'
                  Set-Content -Path $_.FullName -Value $c -Encoding UTF8
              }
          }
          
          Write-Host "-> Cambiando el Titulo de la Ventana a Almpes..."
          $winRunner = "flutter/windows/runner/main.cpp"
          if (Test-Path $winRunner) {
              $c = Get-Content $winRunner -Raw
              $c = $c -replace 'window\.Create\(L"RustDesk",', 'window.Create(L"Almpes",'
              Set-Content -Path $winRunner -Value $c -Encoding UTF8
          }
          
          Write-Host "-> Inyectando Servidor y Key..."
          $serverConfig = "flutter/lib/models/server_config.dart"
          if (Test-Path $serverConfig) {
              $c = Get-Content $serverConfig -Raw
              $c = $c -replace "custom-rendezvous-server', ''", "custom-rendezvous-server', '103.195.100.225'"
              $c = $c -replace "key', ''", "key', 'pLGeVp6JeORPB9KTHogPGnMYAH6Qs6blBRA+QS'"
              Set-Content -Path $serverConfig -Value $c -Encoding UTF8
          }

      - name: 5. Cargar Caché de VCPKG
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-windows-rustdesk-cache

      - name: 6. Instalar Motor VCPKG y Codecs
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "-> Compilando VCPKG..."
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          git checkout 9e593bb18ea69cc5095e012465dcd675a822ed0d
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install --triplet x64-windows-static --x-install-root="$env:GITHUB_WORKSPACE\vcpkg\installed"

      - name: 7. Configurar Rust Oficial (1.75.0)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0

      - name: 8. Configurar Flutter Oficial (3.24.5)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          architecture: x64

      - name: 9. Compilar Almpes Nativo
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        shell: pwsh
        run: |
          Write-Host "-> Instalando Generador de Puente..."
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          
          Write-Host "-> Construyendo el Puente Rust-Flutter..."
          $codegen = "$HOME\.cargo\bin\flutter_rust_bridge_codegen.exe"
          & $codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          
          Write-Host "-> Preparando dependencias de Flutter..."
          cd flutter
          flutter pub get
          cd ..
          
          Write-Host "-> Iniciando compilacion Total..."
          python ./build.py --flutter
          
          Write-Host "-> Preparando ejecutable..."
          $flutterExe = "flutter/build/windows/x64/runner/Release/rustdesk.exe"
          if (Test-Path $flutterExe) {
              Rename-Item $flutterExe "Almpes.exe"
          }

      - name: 10. Entregar Ejecutable Final (Carpeta Completa)
        uses: actions/upload-artifact@v4
        with:
          name: Almpes-Windows-Release
          path: flutter/build/windows/x64/runner/Release/
